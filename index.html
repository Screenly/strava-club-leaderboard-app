<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strava Club Leaderboard - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      padding="0"
    >
      <div id="app" data-state="loading">
        <header class="masthead">
          <div class="club">
            <div class="club-avatar" data-club-avatar>
              <span class="club-initials" data-club-initials></span>
              <img class="club-logo" data-club-logo alt="" hidden />
            </div>
            <div class="club-text">
              <div class="eyebrow" data-eyebrow>Club leaderboard</div>
              <h1 class="club-name" data-club-name>Strava club</h1>
            </div>
          </div>
          <dl class="totals" data-totals>
            <div class="total">
              <dt>Athletes</dt>
              <dd data-total="athletes">–</dd>
            </div>
            <div class="total">
              <dt>Activities</dt>
              <dd data-total="activities">–</dd>
            </div>
            <div class="total">
              <dt>Distance</dt>
              <dd data-total="distance">–</dd>
            </div>
            <div class="total">
              <dt>Moving time</dt>
              <dd data-total="time">–</dd>
            </div>
          </dl>
        </header>

        <main class="board">
          <section class="podium" data-podium></section>
          <ol class="ranks" data-ranks></ol>
          <div class="message" data-message role="status">
            <div class="message-mark" aria-hidden="true"></div>
            <div class="message-title" data-message-title>
              Loading the leaderboard
            </div>
            <div class="message-hint" data-message-hint>
              Fetching the club's latest activities from Strava.
            </div>
          </div>
        </main>

        <footer class="footer">
          <div class="status" data-status-tone="live">
            <span class="status-dot" aria-hidden="true"></span>
            <span data-status>&nbsp;</span>
          </div>
          <div class="scope" data-scope>&nbsp;</div>
          <div
            class="powered"
            data-powered
            aria-label="Powered by Strava"
          ></div>
        </footer>
      </div>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
