---
syntax: manifest_v1
description: Displays a leaderboard of a Strava club's recent activities.
icon: https://playground.srly.io/edge-apps/icons/strava-club-leaderboard.svg
author: Screenly, Inc.
categories:
  - Dashboards
  - Just for Fun
ready_signal: true
settings:
  access_token:
    type: secret
    title: Strava Access Token
    optional: false
    help_text: |
      Enter your Strava Access Token from https://www.strava.com/settings/api (keep this secure).
  activity_type:
    type: string
    title: Sport
    default_value: all
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        help_text: |
          Rank athletes on one sport, the way Strava's own club leaderboards do, or on every activity together.
        options:
          - label: All sports
            value: all
          - label: Running
            value: run
          - label: Cycling
            value: ride
          - label: Swimming
            value: swim
          - label: Walking and hiking
            value: walk
  client_id:
    type: string
    title: Strava Client ID
    optional: false
    help_text: |
      Enter your Strava API Client ID from https://www.strava.com/settings/api (public identifier for your app).
  client_secret:
    type: secret
    title: Strava Client Secret
    optional: false
    help_text: |
      Enter your Strava API Client Secret from https://www.strava.com/settings/api (keep this secure).
  club_id:
    type: string
    title: Strava Club ID
    optional: false
    help_text: |
      Enter the numeric ID of the Strava club to display. Find it in the club URL: https://www.strava.com/clubs/{club_id}
  refresh_token:
    type: secret
    title: Strava Refresh Token
    optional: false
    help_text: |
      Enter your Strava Refresh Token from https://www.strava.com/settings/api (keep this secure).
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text: |
      Enter your Sentry DSN to enable error tracking and monitoring.
  theme:
    type: string
    title: Theme
    default_value: dark
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        help_text: |
          Dark suits a gym, a clubhouse or a screen left on all evening; light suits a bright office or lobby.
        options:
          - label: Dark
            value: dark
          - label: Light
            value: light
  unit_type:
    type: string
    title: Unit System
    default_value: metric
    optional: true
    help_text:
      properties:
        type: select
        help_text: |
          Choose the unit system for displaying distance and elevation. Options: "metric" (km, m) or "imperial" (mi, ft).
        options:
          - label: Metric
            value: metric
          - label: Imperial
            value: imperial
      schema_version: 1
